[nightlight]
enabled = false

[shell]
font_family = "CodeNewRoman Nerd Font Mono"
niri_overview_type_to_launch_enabled = true
settings_show_advanced = true

    [shell.launcher]
    pinned = []

    [shell.panel]
    control_center_position = "top_right"
    launcher_position = "top_left"
    open_near_click_control_center = true
    transparency_mode = "soft"

    [shell.shadow]
    alpha = 0.79999998211860657

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
shell_mode = "dark"
source = "community"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "niri" ]
    community_ids = []
    enable_community_templates = false

[widget.clock]
format = "{:%H:%M}"

[widget.network]
show_label = false

