[backdrop]
enabled = true

[bar.default]
background_opacity = 0.79999998211860657
concave_edge_corners = false
contact_shadow = true
margin_edge = 0
margin_ends = 0
margin_opposite_edge = 0
padding = 10
position = "left"
radius = 0
radius_top_left = 0
radius_top_right = 0
shadow = true
thickness = 39

[dock]
active_monitor_only = false
auto_hide = false
background_opacity = 0.79999998211860657
enabled = false
icon_size = 29
pinned = []
position = "right"
reserve_space = false
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 120.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 180.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 120.0

[location]
auto_locate = true

[lockscreen_widgets]
