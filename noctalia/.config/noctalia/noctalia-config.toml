[backdrop]
enabled = true

[bar.default]
background_opacity = 0.79999998211860657
contact_shadow = true
margin_edge = 4
margin_ends = 4
margin_opposite_edge = 4
padding = 10
position = "left"
radius = 10
radius_top_left = 10
radius_top_right = 10
shadow = true
thickness = 41

[dock]
auto_hide = true
icon_size = 29
position = "right"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 10

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 120.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 180.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 120.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "HDMI-A-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 1081.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = false

[shell]
font_family = "CodeNewRoman Nerd Font Mono"
niri_overview_type_to_launch_enabled = true
settings_show_advanced = true

    [shell.panel]
    control_center_position = "top_right"
    open_near_click_control_center = true

[theme]
builtin = "Gruvbox"
community_palette = "Gruber Darker"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [
        "btop",
        "foot",
        "gtk3",
        "gtk4",
        "niri",
        "qt",
    ]
    enable_community_templates = true

[widget.clock]
format = "{:%H:%M}"

[widget.network]
show_label = false
