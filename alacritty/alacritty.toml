[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"
WSLENV = "COLORTERM/u"

[window]
decorations = "None"
startup_mode = "Maximized"
padding = { x = 8, y = 8 }

[font]
size = 12

[terminal]
osc52 = "CopyPaste"

[mouse]
hide_when_typing = true

[terminal.shell]
program = "wsl.exe"
args = [
    "~",
    "-d",
    "openSUSE-Tumbleweed"
]
